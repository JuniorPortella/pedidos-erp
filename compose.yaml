name: pedidos-full

services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - pedidos-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    ports:
      - "${API_PORT}:80"

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE}
      AUTH_CSRF_ENABLED: ${AUTH_CSRF_ENABLED}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - pedidos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:18080}

    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5173"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - pedidos-network

volumes:
  mysql-data:
  frontend-node-modules:

networks:
  pedidos-network:
    driver: bridge
