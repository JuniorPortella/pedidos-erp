name: pedidos-full

services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - pedidos-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    ports:
      - "${API_PORT}:80"

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - pedidos-network

volumes:
  mysql-data:

networks:
  pedidos-network:
    driver: bridge
