user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    map $uri $login_limit_key {
        default "";
        /api/auth/login $binary_remote_addr;
    }

    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $login_limit_key zone=login_per_ip:10m rate=10r/m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        server api:80 resolve;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl;
        server_name pedidos-erp.engenhariasigma.net;

        ssl_certificate /etc/letsencrypt/live/pedidos-erp.engenhariasigma.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pedidos-erp.engenhariasigma.net/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        limit_conn connections_per_ip 30;

        root /usr/share/nginx/html;
        index index.html;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_req zone=login_per_ip burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://api_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cookie_path /auth /api/auth;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
