<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    Header onsuccess unset Cache-Control
    Header onsuccess unset X-Content-Type-Options
    Header onsuccess unset X-Frame-Options
    Header onsuccess unset Referrer-Policy
    Header onsuccess unset Content-Security-Policy
    Header onsuccess unset Permissions-Policy

    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        LimitRequestBody 1048576

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
Header always unset X-Powered-By
