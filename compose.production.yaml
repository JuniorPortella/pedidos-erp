name: pedidos-erp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    mem_limit: 1g
    logging: *default-logging

  api:
    image: pedidos-erp-api:production
    build:
      context: ./api
      dockerfile: Dockerfile.production
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-86400}
      JWT_ISSUER: ${JWT_ISSUER:-pedidos-erp-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pedidos-erp-frontend}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AUTH_CSRF_ENABLED: "true"
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_IP_MAX_ATTEMPTS: ${AUTH_LOGIN_IP_MAX_ATTEMPTS:-20}
      AUTH_LOGIN_WINDOW: ${AUTH_LOGIN_WINDOW:-900}
      AUTH_LOGIN_BLOCK: ${AUTH_LOGIN_BLOCK:-900}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    mem_limit: 512m
    logging: *default-logging

  frontend:
    image: pedidos-erp-frontend:production
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_HTTPS_PORT:-8443}:443"
    volumes:
      - /etc/letsencrypt-pedidos-erp:/etc/letsencrypt:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/healthz"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
    mem_limit: 128m
    logging: *default-logging

volumes:
  mysql-data:

networks:
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
